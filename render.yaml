services:
  - type: web
    name: jobtrack-api
    runtime: python
    plan: free
    rootDir: JobTrack/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://jobtrack-frontend.onrender.com

  - type: web
    name: jobtrack-frontend
    runtime: node
    plan: free
    rootDir: JobTrack/frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run preview -- --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: jobtrack-api
          property: host

databases:
  - name: jobtrack-db
    databaseName: jobtrack
    user: jobtrack
    plan: free
