services:
  - type: web
    name: jobtrack-api
    runtime: python
    plan: free
    rootDir: JobTrack/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        fromService:
          type: static
          name: jobtrack-frontend
          property: host

  - type: static
    name: jobtrack-frontend
    rootDir: JobTrack/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: jobtrack-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: jobtrack-db
    databaseName: jobtrack
    user: jobtrack
    plan: free
